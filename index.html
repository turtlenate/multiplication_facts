<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="./style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Annie+Use+Your+Telescope&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
          <svg class="math-bg" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
            <defs>
                <pattern id="mathPattern" x="0" y="0" width="300" height="300" patternUnits="userSpaceOnUse">
                    <!-- Slightly rotated equations -->
                    <text x="20" y="50" font-family="Arial, sans-serif" font-size="30" fill="#000" opacity="0.06" transform="rotate(-12 20 50)">4 x 6</text>
                    <text x="160" y="40" font-family="Arial, sans-serif" font-size="24" fill="#000" opacity="0.05">8 x 3</text>
                    <!-- Isolated answers -->
                    <text x="40" y="140" font-family="Arial, sans-serif" font-size="40" fill="#000" opacity="0.07">24</text>
                    <text x="180" y="150" font-family="Arial, sans-serif" font-size="26" fill="#000" opacity="0.05" transform="rotate(8 180 150)">7 x 9</text>
                    <text x="90" y="230" font-family="Arial, sans-serif" font-size="28" fill="#000" opacity="0.06">12 x 12</text>
                    <text x="220" y="270" font-family="Arial, sans-serif" font-size="22" fill="#000" opacity="0.05" transform="rotate(-5 220 270)">= 144</text>
                </pattern>
            </defs>
            <!-- Fills the whole SVG with the pattern above -->
            <rect width="100%" height="100%" fill="url(#mathPattern)" />
        </svg>
    <h1>Multiplication Facts</h1>
    
    <div id="content">
        <div class="text">
            We are going to work on the 2 multiplication facts.
        </div>
        <div id="questionAnswer">
            <div id="question"></div>
            <input type="string" id="ans">
            
        </div>
        <button id="submitButton" type="button" onclick="buttonPressed()">Submit</button>
        <button id="pickFactButton" type="button">Select Fact</button>
    </div>

        <div class="bottomPage">
            
            <h2 id="feedback"></h2>
        </div>

          <img id="green-parrot" src="green_parrot.png"></img>
          <img id="blue-bird-flying" src="blue_bird_flying.png"></img>

    </div>

    <dialog id="pickFact">
        Select the multiplication fact you would like to practise.

        <button id="fact2" class="fact-btn" data-fact="2" type="button">2 ×</button>
        <button id="fact3" class="fact-btn" data-fact="3" type="button">3 ×</button>
        <button id="fact4" class="fact-btn" data-fact="4" type="button">4 ×</button>
        <button id="fact5" class="fact-btn" data-fact="5" type="button">5 ×</button>
        <button id="fact6" class="fact-btn" data-fact="6" type="button">6 ×</button>
        <button id="fact7" class="fact-btn" data-fact="7" type="button">7 ×</button>
        <button id="fact8" class="fact-btn" data-fact="8" type="button">8 ×</button>
        <button id="fact9" class="fact-btn" data-fact="9" type="button">9 ×</button>
        <button id="fact10" class="fact-btn" data-fact="10" type="button">10 ×</button>
        <button id="fact11" class="fact-btn" data-fact="11" type="button">11 ×</button>
        <button id="fact12" class="fact-btn" data-fact="12" type="button">12 ×</button>
    </dialog>

    <script src="script.js"></script>
</body>
</html>
