<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="./style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Annie+Use+Your+Telescope&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
    <h1>Multiplication Facts</h1>
    
    <div id="content">
        <div class="text">
            We are going to work on the 2 multiplication facts.
        </div>
        <div id="questionAnswer">
            <div id="question"></div>
            <input type="string" id="ans">
            
        </div>
        <button id="submitButton" type="button" onclick="buttonPressed()">Submit</button>
        <button id="pickFactButton" type="button">Select Fact</button>
    </div>
        <div class="bottomPage">
            
            <h2 id="feedback">feedback</h2>
        </div>
    </div>

    <dialog id="pickFact">
        Select the multiplication fact you would like to practise.

        <button id="fact2" class="fact-btn" data-fact="2" type="button">2</button>
        <button id="fact3" class="fact-btn" data-fact="3" type="button">3</button>
        <button id="fact4" class="fact-btn" data-fact="4" type="button">4</button>
        <button id="fact5" class="fact-btn" data-fact="5" type="button">5</button>
        <button id="fact6" class="fact-btn" data-fact="6" type="button">6</button>
        <button id="fact7" class="fact-btn" data-fact="7" type="button">7</button>
        <button id="fact8" class="fact-btn" data-fact="8" type="button">8</button>
        <button id="fact9" class="fact-btn" data-fact="9" type="button">9</button>
        <button id="fact10" class="fact-btn" data-fact="10" type="button">10</button>
        <button id="fact11" class="fact-btn" data-fact="11" type="button">11</button>
        <button id="fact12" class="fact-btn" data-fact="12" type="button">12</button>
    </dialog>
    <script src="script.js"></script>
</body>
</html>
